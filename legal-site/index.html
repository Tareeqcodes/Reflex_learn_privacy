<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reflex Learn  Legal</title>
  <style>
    :root {
      --bg: #f9f8f5; --surface: #ffffff; --text: #1e1b2e; --muted: #6b6878;
      --border: #e7e4dd; --link: #7a5cff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #16151c; --surface: #1e1d26; --text: #efeef2; --muted: #a3a1ad; --border: #2c2b36; --link: #b3a1ff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { text-align: center; padding: 32px 20px; max-width: 420px; }
    h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.3px; }
    p { color: var(--muted); margin: 0 0 28px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; color: var(--text); text-decoration: none;
      font-weight: 600;
    }
    a.btn:hover { border-color: var(--link); }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Reflex Learn</h1>
    <p>Practice speaking, out loud.</p>
    <div class="links">
      <a class="btn" href="privacy.html">Privacy Policy</a>
      <a class="btn" href="terms.html">Terms of Service</a>
    </div>
  </main>
</body>
</html>
